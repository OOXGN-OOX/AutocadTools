name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
  release:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate version and release notes
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Expected vX.Y.Z tag.' }
          $version = ([xml](Get-Content AutocadTools.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:TAG_NAME -ne "v$version") { throw 'Tag and project versions differ.' }
          if (!(Test-Path -LiteralPath "docs/releases/$($env:TAG_NAME).md")) { throw 'Release notes missing.' }
      - name: Build distribution once
        shell: cmd
        run: build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: AutocadTools-release
          path: |
            artifacts/release/*-Setup.exe
            artifacts/release/*-Bundle.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.Substring(1)
          gh release create $env:TAG_NAME "artifacts/release/AutocadTools-$version-Setup.exe" "artifacts/release/AutocadTools-$version-Bundle.zip" "artifacts/release/SHA256SUMS.txt" --verify-tag --title "Autocad Tools $version" --notes-file "docs/releases/$($env:TAG_NAME).md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; build artifacts are available for recovery.' }
